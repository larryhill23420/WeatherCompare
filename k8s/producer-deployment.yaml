apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-producer
  template:
    metadata:
      labels:
        app: weather-producer
    spec:
      containers:
      - name: producer
        image: weather-ingest:latest   # replace with your real image
        imagePullPolicy: Never
        command: ["python", "producer.py"]
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-creds
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          value: "us-west-2"
        - name: KAFKA_BOOTSTRAP
          value: "kafka:9092"