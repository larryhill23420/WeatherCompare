<!DOCTYPE html>
<html>
<head>
  <title>Weather Compare</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    tr.zip1 { background: white; }
    tr.zip2 { background: #f0f0f0; }
    .controls, .add-form { margin-bottom: 1.5rem; }
    select, button, input { padding: 6px 10px; margin-right: 8px; }
    #add-status { margin-left: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Weather Compare</h1>

  <div class="add-form">
    <h3>Add New Zip Code</h3>
    <input type="text" id="new-zip" placeholder="Zip code" maxlength="5">
    <select id="add-days">
      <option value="1">1 day</option>
      <option value="7" selected>7 days</option>
    </select>
    <button onclick="addZip()">Add Zip Code</button>
    <span id="add-status"></span>
  </div>

  <div class="controls">
    <select id="zip1"></select>
    <select id="zip2"></select>
    <select id="days">
      <option value="1" selected>1 day</option>
      <option value="2">2 days</option>
      <option value="3">3 days</option>
      <option value="4">4 days</option>
      <option value="5">5 days</option>
      <option value="6">6 days</option>
      <option value="7">7 days</option>
    </select>
    <button onclick="compare()">Compare Weather</button>
  </div>

  <table id="data">
    <thead>
      <tr>
        <th>Local Time</th>
        <th>Zip</th>
        <th>Place Name</th>
        <th>Temp</th>
        <th>Temp Diff</th>
        <th>Rain</th>
        <th>Rain Diff</th>
        <th>Humid</th>
        <th>Humid Diff</th>
        <th>Cloud</th>
        <th>Cloud Diff</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const COMPARE_URL = "https://ocw3et6rrpypcwcoeaj7gqzliy0oksgx.lambda-url.us-west-2.on.aws/";
    const ADD_ZIP_URL = "https://ibaykpce4noeovznl5taqqqn2a0zeyuv.lambda-url.us-west-2.on.aws/";
    const LIST_ZIPS_URL = "https://o262tabg6eggjlckjnr6nmm4tu0bjsru.lambda-url.us-west-2.on.aws/";

    function loadZips() {
      fetch(LIST_ZIPS_URL)
        .then(r => r.json())
        .then(zips => {
          const zip1 = document.getElementById("zip1");
          const zip2 = document.getElementById("zip2");
          zip1.innerHTML = "";
          zip2.innerHTML = "";
          if (!Array.isArray(zips)) {
            console.error("list-zips did not return an array", zips);
            return;
          }
          zips.forEach(z => {
            const label = `${z.placeName} (${z.zip})`;
            zip1.add(new Option(label, z.zip));
            zip2.add(new Option(label, z.zip));
          });
          if (zips.length > 1) zip2.selectedIndex = 1;
        })
        .catch(err => console.error("Failed to load zips", err));
    }

        function addZip() {
      const zip = document.getElementById("new-zip").value.trim();
      const days = document.getElementById("add-days").value;
      const status = document.getElementById("add-status");
      const previousZip2 = document.getElementById("zip2").value;  // remember second dropdown
      status.textContent = "Adding... (this can take a minute)";
      status.style.color = "black";

      fetch(`${ADD_ZIP_URL}?zip=${zip}&days=${days}`)
        .then(r => {
          if (!r.ok) throw new Error("Request failed");
          return r.json();
        })
        .then(result => {
          if (result.success) {
            status.textContent = `Added ${result.place_name} (${result.readings_inserted} readings)`;
            status.style.color = "green";
          } else {
            status.textContent = result.error || "Failed";
            status.style.color = "red";
          }
          setTimeout(() => {
            loadZips();
            setTimeout(() => {
              // Set first dropdown to the new zip
              const zip1 = document.getElementById("zip1");
              if ([...zip1.options].some(o => o.value === zip)) {
                zip1.value = zip;
              }
              // Restore second dropdown to whatever it was before
              const zip2 = document.getElementById("zip2");
              if ([...zip2.options].some(o => o.value === previousZip2)) {
                zip2.value = previousZip2;
              }
            }, 600);
          }, 1000);
        })
        .catch(err => {
          status.textContent = "Request timed out or failed — refreshing list anyway...";
          status.style.color = "orange";
          setTimeout(loadZips, 2000);
        });
    }

    function compare() {
      const zip1 = document.getElementById("zip1").value;
      const zip2 = document.getElementById("zip2").value;
      const days = document.getElementById("days").value;
      const tbody = document.querySelector("#data tbody");
      tbody.innerHTML = "";

      fetch(`${COMPARE_URL}?zip1=${zip1}&zip2=${zip2}&days=${days}`)
        .then(r => r.json())
        .then(rows => {
          const fmt = (n) => (n > 0 ? "+" + n : n);
          const fmtTime = (t) => t ? t.replace("T", " ").slice(0, 16) : "";

          rows.forEach(row => {
            const local = fmtTime(row.LocalTime);
            tbody.innerHTML += `
              <tr class="zip1">
                <td>${local}</td>
                <td>${row.ZipCode1 || ""}</td>
                <td>${row.PlaceName1 || ""}</td>
                <td>${row.Temp1 ?? ""}</td>
                <td>${fmt(row.TempDiff)}</td>
                <td>${row.Rain1 ?? ""}</td>
                <td>${fmt(row.RainDiff)}</td>
                <td>${row.Humid1 ?? ""}</td>
                <td>${fmt(row.HumidDiff)}</td>
                <td>${row.Cloud1 ?? ""}</td>
                <td>${fmt(row.CloudDiff)}</td>
              </tr>`;
            tbody.innerHTML += `
              <tr class="zip2">
                <td>${local}</td>
                <td>${row.ZipCode2 || ""}</td>
                <td>${row.PlaceName2 || ""}</td>
                <td>${row.Temp2 ?? ""}</td>
                <td>${fmt(-row.TempDiff)}</td>
                <td>${row.Rain2 ?? ""}</td>
                <td>${fmt(-row.RainDiff)}</td>
                <td>${row.Humid2 ?? ""}</td>
                <td>${fmt(-row.HumidDiff)}</td>
                <td>${row.Cloud2 ?? ""}</td>
                <td>${fmt(-row.CloudDiff)}</td>
              </tr>`;
          });
        })
        .catch(err => console.error(err));
    }

    loadZips();
  </script>
</body>
</html>
