<!DOCTYPE html>
<html>
<head>
  <title>Weather Compare</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f4f4f4; }
    tr.zip1 { background: white; }
    tr.zip2 { background: #f0f0f0; }
    .controls { margin-bottom: 1rem; }
    select, button { padding: 6px 10px; margin-right: 8px; }
    .time-header { background: #e8e8e8; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Weather Compare</h1>

  <div class="controls">
    <select id="zip1">
      <option value="98593">Vader, WA (98593)</option>
      <option value="19422">Blue Bell, PA (19422)</option>
    </select>
    <select id="zip2">
      <option value="19422">Blue Bell, PA (19422)</option>
      <option value="98593">Vader, WA (98593)</option>
    </select>
    <button onclick="compare()">Compare Weather</button>
  </div>

  <table id="data">
    <thead>
      <tr>
        <th>Local Time</th>
        <th>Zip</th>
        <th>Place Name</th>
        <th>Temp</th>
        <th>Temp Diff</th>
        <th>Rain</th>
        <th>Rain Diff</th>
        <th>Humid</th>
        <th>Humid Diff</th>
        <th>Cloud</th>
        <th>Cloud Diff</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const FUNCTION_URL = "https://YOUR-FUNCTION-URL.lambda-url.us-west-2.on.aws/";

    function compare() {
      const zip1 = document.getElementById("zip1").value;
      const zip2 = document.getElementById("zip2").value;
      const tbody = document.querySelector("#data tbody");
      tbody.innerHTML = "";

      fetch(`${FUNCTION_URL}?zip1=${zip1}&zip2=${zip2}`)
        .then(r => r.json())
        .then(rows => {
          rows.forEach(row => {
            // Time separator row
            tbody.innerHTML += `
              <tr class="time-header">
                <td colspan="11">${row.LocalTime || ""}</td>
              </tr>`;

            // Zip1 row (white)
            tbody.innerHTML += `
              <tr class="zip1">
                <td></td>
                <td>${row.ZipCode1 || ""}</td>
                <td>${row.PlaceName1 || ""}</td>
                <td>${row.Temp1 ?? ""}</td>
                <td>${row.TempDiff ?? ""}</td>
                <td>${row.Rain1 ?? ""}</td>
                <td>${row.RainDiff ?? ""}</td>
                <td>${row.Humid1 ?? ""}</td>
                <td>${row.HumidDiff ?? ""}</td>
                <td>${row.Cloud1 ?? ""}</td>
                <td>${row.CloudDiff ?? ""}</td>
              </tr>`;

            // Zip2 row (light gray)
            tbody.innerHTML += `
              <tr class="zip2">
                <td></td>
                <td>${row.ZipCode2 || ""}</td>
                <td>${row.PlaceName2 || ""}</td>
                <td>${row.Temp2 ?? ""}</td>
                <td>${row.TempDiff ? -row.TempDiff : ""}</td>
                <td>${row.Rain2 ?? ""}</td>
                <td>${row.RainDiff ? -row.RainDiff : ""}</td>
                <td>${row.Humid2 ?? ""}</td>
                <td>${row.HumidDiff ? -row.HumidDiff : ""}</td>
                <td>${row.Cloud2 ?? ""}</td>
                <td>${row.CloudDiff ? -row.CloudDiff : ""}</td>
              </tr>`;
          });
        })
        .catch(err => console.error(err));
    }
  </script>
</body>
</html>
